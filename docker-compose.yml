services:
  # 1. Baza danych MySQL
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: timesheet_db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Nasz serwer Node.js (Backend)
  backend: 
    container_name: ai-timesheet-assistant-backend-1
    build: ./backend
    ports:
      - "${PORT}:${PORT}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: ${PORT}
    depends_on:
      db:
        condition: service_healthy

  # 3. Nasza aplikacja React (Frontend)
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - FRONTEND_PORT=${FRONTEND_PORT}
    depends_on:
      - backend